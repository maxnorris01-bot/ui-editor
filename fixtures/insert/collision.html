<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Class collision</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    .new-box-1 { width: 40px; height: 40px; background: #cc3333; }
  </style>
</head>
<body>
  <div id="existing" class="new-box-1"></div>
  <p id="after">The page already uses the class new-box-1.</p>
</body>
</html>
