<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relative units</title>
<style>
body { margin: 0; font-family: Arial, sans-serif; font-size: 16px; line-height: 1.2; }
.box { padding: 12px 16px; }
.note { font-size: 1.5rem; margin: 0 0 8px; }
.lede-wrap { font-size: 16px; }
.lede { font-size: 1.5em; margin: 0 0 8px; }
@media (max-width: 640px) {
  .note { font-size: 1.125rem; }
  .lede { font-size: 1.1em; }
}
</style>
</head>
<body>
<div class="box">
  <p class="note" id="n1">Rem note one</p>
  <p class="note" id="n2">Rem note two</p>
  <div class="lede-wrap">
    <p class="lede" id="lede">Em lede</p>
    <p class="lede" id="lede2">Em lede two</p>
  </div>
</div>
</body>
</html>
