<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colour</title>
<style>
body { margin: 0; font-family: Arial, sans-serif; font-size: 16px; line-height: 1.2; }
.tag { color: #333333; margin: 0 0 8px; }
.chip { color: #2c3e50; margin: 0 0 8px; }
@media (max-width: 640px) {
  .tag { color: #999999; }
  .chip { color: #2c3e50; }
}
</style>
</head>
<body>
<p class="tag" id="tag1">Tag one</p>
<p class="tag" id="tag2">Tag two</p>
<p class="chip" id="chip1">Chip one</p>
<p class="chip" id="chip2">Chip two</p>
</body>
</html>
