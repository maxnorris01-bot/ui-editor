<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile card</title>
</head>
<body style="margin:0;padding:24px;font-family:Arial, Helvetica, sans-serif;background:#f4f1ea;color:#333">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #d8d2c4;border-radius:8px;padding:20px">
    <h1 id="title" style="margin:0 0 6px 0;font-size:32px;font-weight:700;color:#222222">Maya Okafor</h1>
    <p style="margin:0 0 16px 0;font-size:15px;color:#6b6558">Product designer, Lagos &amp; Berlin</p>
    <div id="photo" style="width:200px;height:120px;background:#c9d6df;border-radius:4px;margin-bottom:16px"></div>
    <span id="badge" style="display:inline-block;padding:4px 10px;background:#ffd166;color:#4a3b00;font-size:12px;font-weight:700;border-radius:12px">Open to work</span>
    <p id="bio" style="margin:16px 0;line-height:1.5;font-size:15px">I design calm interfaces for busy tools. Currently exploring data-dense dashboards and the small details that make them readable.</p>
    <div id="actions" style="display:block;border-top:1px solid #e5dfd0;padding-top:12px">
      <span id="b-cancel" style="display:inline-block;padding:6px 14px;margin-right:8px;border:1px solid #999;border-radius:4px;font-size:14px">Cancel</span>
      <span id="b-save" style="display:inline-block;padding:6px 14px;margin-right:8px;background:#2a6f4f;color:#fff;border-radius:4px;font-size:14px">Save</span>
      <span id="b-help" style="display:inline-block;padding:6px 14px;font-size:14px;color:#2a6f4f">Help</span>
    </div>
  </div>
</body>
</html>
