<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Studio notes</title>
<style>
  body { margin: 0; padding: 32px; font-family: Georgia, serif; background: #fbfaf7; color: #2b2b2b; }
  h1 { font-size: 36px; margin: 0 0 12px; }
  h2.section-title { font-size: 22px; margin: 28px 0 8px; text-align: left; border-bottom: 2px solid #e2dccb; }
  .lead { font-size: 18px; padding: 8px 12px; background: #f1ecdd; }
  .note { font-size: 14px; color: #6a6254; }
  #cta { display: inline-block; font-size: 16px; padding: 10px 18px; background: #1d4e89; color: #ffffff; text-decoration: none; }
  #promo { position: relative; width: 260px; padding: 12px; background: #fde8c8; transform: scale(1.1); transform-origin: top left; margin-top: 24px; }
</style>
</head>
<body>
  <h1>Studio notes</h1>
  <p class="lead">Short writing about how we work, what we make and why.</p>
  <h2 class="section-title" id="about-title">About us</h2>
  <p class="note">We are a team of six working out of a converted print shop.</p>
  <h2 class="section-title" id="work-title">Our work</h2>
  <p class="note">Brand identities, editorial layouts and a few small tools.</p>
  <a id="cta" href="#contact">Get in touch</a>
  <div id="promo">Spring workshop: book before March 1.</div>

</html>
