<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Size guard</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; font-size: 16px; line-height: 20px; }
#big { width: 300px; height: 30px; margin: 0 0 8px; background: #dddddd; }
#capped { width: 400px; max-width: 480px; height: 30px; margin: 0 0 8px; background: #cfe3f5; }
@media (max-width: 640px) {
  #big { width: 250px; }
  #capped { width: 200px; }
}
</style>
</head>
<body>
<div id="big">Grows past the phone</div>
<div id="capped">Has its own max-width</div>
</body>
</html>
