<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reorder</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    .t { font-size: 16px; margin: 0 0 8px; }
    @media (max-width: 640px) {
      .t { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <section id="s1">
      <h2 id="h1">First</h2>
      <p class="t" id="a1">Alpha</p>
    </section>
    <section id="s2">
      <h2 id="h2">Second</h2>
      <p class="t" id="a2">Beta</p>
    </section>
    <section id="s3">
      <h2 id="h3">Third</h2>
      <p class="t" id="a3">Gamma</p>
    </section>
  </div>
</body>
</html>
