<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Size units</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; font-size: 16px; line-height: 20px; }
#re { width: 30rem; height: 30px; margin: 0 0 8px; background: #dddddd; }
#fn { width: 600px; height: 30px; margin: 0 0 8px; background: #cfe3f5; }
@media (max-width: 640px) {
  #re { width: 15em; }
  #fn { width: clamp(200px, 50vw, 500px); }
}
</style>
</head>
<body>
<div id="re">rem then em</div>
<div id="fn">clamp on phone</div>
</body>
</html>
