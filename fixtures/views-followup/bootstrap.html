<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Follow-up</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    .h { font-size: 40px; margin: 0 0 16px; }
    .t { font-size: 16px; margin: 0 0 12px; }
    .box { width: 560px; height: 160px; background: #cde; padding: 16px; box-sizing: border-box; }
    .card { padding: 24px; margin: 0 0 12px; background: #eee; }
    @media (min-width: 767.98px) {
      .box { padding: 28px; }
    }
    @media (max-width: 991.98px) {
      .h { font-size: 32px; }
    }
    @media (max-width: 575.98px) {
      .h { font-size: 20px; }
      .box { width: 300px; }
    }
  </style>
</head>
<body>
  <h1 id="title" class="h">Title</h1>
  <p id="para" class="t">A paragraph of text.</p>
  <div id="box" class="box">Box</div>
  <div id="card" class="card">Card</div>
</body>
</html>
