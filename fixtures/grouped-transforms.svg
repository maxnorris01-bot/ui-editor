<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="600" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe8f7"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <g id="dot-shape">
      <circle r="4" fill="#d1495b"/>
      <circle r="2" fill="#ffffff"/>
    </g>
  </defs>
  <rect id="bg" x="0" y="0" width="400" height="300" fill="url(#sky)"/>
  <g id="outer" transform="translate(40,30) scale(1.5)">
    <g id="inner" transform="rotate(20 60 60)">
      <rect id="g-rect" x="20" y="40" width="80" height="40" fill="#edae49" stroke="#333" stroke-width="1"/>
      <text id="g-label" x="30" y="64" font-family="Arial, sans-serif" font-size="10" fill="#222">Rotated label</text>
    </g>
    <use id="u1" xlink:href="#dot-shape" x="100" y="20"/>
    <circle id="g-circle" cx="120" cy="80" r="10" fill="#00798c"/>
  </g>
  <g id="side" transform="translate(300 200) scale(0.5)">
    <text id="side-text" x="0" y="0" font-size="24" fill="#444">Side note</text>
    <path id="side-line" d="M 0 10 H 120" stroke="#444" stroke-width="2" fill="none"/>
  </g>
</svg>
