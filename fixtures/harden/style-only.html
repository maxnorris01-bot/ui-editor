<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Style block page</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; color: #222222; }
    main { padding: 24px; }
    p { font-size: 16px; line-height: 1.5; margin: 0 0 12px; }
    @media (max-width: 640px) {
      main { padding: 12px; }
      p { font-size: 14px; }
    }
  </style>
</head>
<body>
  <main id="main">
    <h1 id="title">Style block page</h1>
    <p id="intro">One paragraph in a page whose only stylesheet is a style block.</p>
    <ul id="list">
      <li>First</li>
      <li>Second</li>
    </ul>
    <p id="outro">Closing paragraph.</p>
  </main>
</body>
</html>
