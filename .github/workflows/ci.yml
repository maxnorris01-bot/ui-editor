name: Engine checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle
      # The 40-edit gate on the 10 hand-written fixtures, under a run name that cannot already be in the results CSV.
      # run-gate.ts does not set a failing exit code, so the next step fails the job if any row of this run is false.
      - run: npm run gate
        env:
          GATE_RUN: ci-${{ github.run_id }}
      - name: Fail if any gate row of this run failed
        env:
          GATE_RUN: ci-${{ github.run_id }}
        run: |
          rows=$(awk -F, -v r="$GATE_RUN" '$1==r' results/gate-results.csv | wc -l)
          bad=$(awk -F, -v r="$GATE_RUN" '$1==r && $6=="false"' results/gate-results.csv | wc -l)
          echo "gate rows: $rows, failing: $bad"
          test "$rows" -gt 0 && test "$bad" -eq 0
