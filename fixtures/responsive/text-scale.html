<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text scale</title>
<style>
body { margin: 0; font-family: Arial, sans-serif; font-size: 16px; line-height: 1.2; }
.wrap { padding: 12px 16px; }
h1 { font-size: 40px; margin: 0 0 12px; }
.title { font-size: 40px; margin: 0 0 8px; }
.headline { font-size: 40px; margin: 0 0 8px; }
.meta { font-size: 14px; color: #555555; margin: 0; }
@media (max-width: 640px) {
  h1 { font-size: 16px; }
  .title { font-size: 16px; }
  .headline { font-size: 16px; }
}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="hero">Quarterly report</h1>
  <p class="title" id="t1">First title</p>
  <p class="title" id="t2">Second title</p>
  <p class="headline" id="head">Phone headline</p>
  <p class="meta" id="m1">Updated daily</p>
</div>
</body>
</html>
